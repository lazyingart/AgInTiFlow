name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Use npm with OIDC support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify package
        env:
          # GitHub-hosted Ubuntu runners SIGKILL nested bubblewrap namespaces.
          # The smoke test still runs the real sealed-runtime proof everywhere else.
          AGINTIFLOW_GITHUB_HOSTED_BWRAP_NAMESPACE_RESTRICTION: allow-sigkill
          AGINTIFLOW_GITHUB_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          npm test
          pack_manifest="${RUNNER_TEMP}/agintiflow-pack-manifest.json"
          npm pack --dry-run --json > "${pack_manifest}"
          node -e 'const fs=require("node:fs"); const manifest=JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0]; if (!manifest.files.some(({path}) => path === "scripts/github-hosted-release-environment.js")) throw new Error("release environment helper is missing from the npm package");' "${pack_manifest}"

      - name: Select npm dist-tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package v${version}." >&2
            exit 1
          fi
          case "${version}" in
            *-integration.*) dist_tag=integration ;;
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          printf 'NPM_DIST_TAG=%s\n' "${dist_tag}" >> "${GITHUB_ENV}"

      - name: Publish to npm
        run: npm publish --access public --provenance --tag "${NPM_DIST_TAG}"
